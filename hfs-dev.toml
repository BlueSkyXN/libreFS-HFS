standard = "2.0"
project = "librefs-hfs"
space = "BlueSkyXN/libreFS-HFS"
sovereignty = "port"
lane = "source"
version_source = "commit"

# This is a semantic registry only. Dockerfile and hfs/start.sh remain the
# authoritative locations for the upstream pin validation and runtime rules.
# Every production build is exported as a minimal wrapper bundle and compiles
# the one immutable libreFS commit recorded in that bundle's provenance.
pattern = "A"
runtime_mode = "bundle-only-build"
space_root_mode = "repo-root"
source_repository = "https://github.com/libreFS/libreFS.git"
release_commit_env = "LIBREFS_COMMIT"
release_gate_env = "HFS_RELEASE_BUILD"
data_mount = "/data"
canonical_health_endpoint = "/minio/health/ready"

# These controls stay local or in protected GitHub Action configuration; they
# are never copied to the Space as runtime settings.
local_only = ["HF_TOKEN", "GH_TOKEN"]

# Names only: values belong in the ignored local .env or the corresponding
# Hugging Face Space Settings surface.
secrets = [
  "MINIO_ROOT_USER",
  "MINIO_ROOT_PASSWORD",
  "OPS_TOKEN",
  "ADMIN_TOKEN",
]
variables = [
  "ADMIN_AUDIT_LOG",
  "ADMIN_ENABLED",
  "CONTROL_PLANE_DEFAULT_LANG",
  "GO_VERSION",
  "HFS_RELEASE_BUILD",
  "LIBREFS_COMMIT",
  "MINIO_API_CORS_ALLOW_ORIGIN",
  "MINIO_API_ROOT_ACCESS",
  "MINIO_BROWSER",
  "MINIO_BROWSER_REDIRECT",
  "MINIO_BROWSER_REDIRECT_URL",
  "MINIO_CALLHOME_ENABLE",
  "MINIO_SERVER_URL",
  "MINIO_SITE_NAME",
  "MINIO_SITE_REGION",
  "MINIO_UPDATE",
  "PUBLIC_BASE_URL",
]
